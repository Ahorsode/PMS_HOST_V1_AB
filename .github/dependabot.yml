version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep Auth.js beta upgrades under manual review while production is pinned.
      - dependency-name: next-auth
        versions: ["5.x"]
      # typescript-eslint (via eslint-config-next) supports TypeScript below 6.1,
      # and `npm run lint` crashes on 7.x. Lift this once it supports newer versions.
      - dependency-name: typescript
        versions: [">= 6.1.0"]
